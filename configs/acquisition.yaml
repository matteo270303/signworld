# Acquisition settings for the datasets of §3 of the project document.
# Secrets never live here: YouTube cookies stay in a private file and BOBSL
# credentials are read from the environment.

data_root: /lustrehome/mvigone/data/signworld

# An item that fails this many times (refusals excluded) is abandoned.
max_attempts: 3

# YouTube refused every shard after about an hour of continuous downloading on
# 2026-09-16 and 2026-09-17, whatever the pace. A run therefore stops before that
# hour and the job rests instead of waiting for the refusal.
run_budget_s: 2400

# Refusals (bot wall, HTTP 429, rejected credentials) pause the shard for
# cooldown_s, doubled at each consecutive refusal (10, then 20 minutes); the
# third in a row stops the shard, and Condor resumes it an hour later.
refusals:
  max_consecutive: 3
  cooldown_s: 600

http:
  chunk_bytes: 8388608
  retries: 5
  timeout_s: 60
  backoff_s: 5

youtube:
  cookies_file: /lustrehome/mvigone/.secrets/youtube_cookies.txt
  # From a datacenter IP YouTube requires a proof-of-origin token, generated by
  # the bgutil provider under deno (deno must be on PATH).
  pot_server_home: /lustrehome/mvigone/bgutil-ytdlp-pot-provider/server
  # 720p leaves enough pixels for the 256 or 384 signer crops (PC4); frame rates
  # above 30 fps are avoided when a 30 fps stream exists.
  max_height: 720
  max_fps: 30
  # decord cannot decode AV1 or VP9 streams.
  prefer_h264: true
  # On 2026-09-16 YouTube refused the IPv4 addresses of every ReCaS worker at once,
  # while each worker also has its own public IPv6 address. The login node has no IPv6.
  ip_version: 6
  retries: 5
  socket_timeout_s: 30
  # A video still downloading after this long is abandoned for this run.
  item_timeout_s: 3600
  # Pacing close to yt-dlp's "sleep" preset: a pause between API requests, a
  # random 10-20 s pause before each video, and one before each subtitle file.
  sleep_requests_s: 0.75
  sleep_min_s: 10
  sleep_max_s: 20
  sleep_subtitles_s: 3

sources:
  youtube_sl25:
    metadata_url: https://storage.googleapis.com/gresearch/youtube-sl-25/youtube-sl-25-metadata.csv
    metadata_sha256: 79e8d2c35b0d3ed31b7e3c32348a1ce64513ca0ef217d7c1cbbd6b14410e7f08
    # The phase-1 gate trains on ASL only (§4.12.2): its 16,724 videos come first.
    first_languages: [ase]

  openasl:
    # Acquired before this pipeline; checked in place. The checksums are those of the
    # annotation files at commit c7d2350 of chevalierNoir/OpenASL.
    local_root: /lustrehome/mvigone/data/openASL
    annotation_file: data/openasl-v1.0.tsv
    annotation_sha256: e7e1559bcef5ac77d2c14c2ccfc9db54516768e296235f266b3f4f96de459a40
    bbox_file: data/bbox-v1.0.json
    bbox_sha256: a79b5327956670db0988bacd96aebb9229ecd5ea948b8de887cb530669152a44
    video_dir: raw-video

  csl_news:
    repo_id: ZechengLi19/CSL-News
    revision: 3a0601210333fe760efd09b5d9e2ae5f341ce339
    labels_path: data/train/CSL_News_Labels.json
    archive_pattern: 'archive_\d{3}\.zip'
    keep_archives: true

  bobsl:
    base_url: https://thor.robots.ox.ac.uk/bobsl/v1.4/
    # To be listed once the BBC grants access and the file index is visible.
    metadata_files: []
    media_files: []

