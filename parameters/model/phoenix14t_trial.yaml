# Run di prova su phoenix14t da solo: split ufficiali del corpus (un solo canale: niente split per canale).
# worldsign.yaml + ablation/arm_A.yaml + questo file.
name: worldsign-phoenix14t
data:
  index: data/training/phoenix14t/index.parquet
  embeddings: data/phoenix14t/text/2fdc70f119730c4c
  split_source: manifest
  validation_split: valid
  validation_clips: 519
  statistics_clips: 5000
training:
  epochs: 15
  validation_every: 25       # il default 4000 non scatterebbe mai su un corpus cosi' piccolo
  log_every: 10
diagnostics:
  cadence: epoch
augmentation:
  enabled: false
