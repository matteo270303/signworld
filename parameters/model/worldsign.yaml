# WorldSign, reference configuration (§4, project document). It is arm A of ESP-1.
# A run = this file + overlays, applied in order, each overriding only what it names:
#   uv run ... -c parameters/model/worldsign.yaml -c parameters/ablation/arm_B.yaml
# Values the document leaves open are marked [Aperto]; PC7 (dry run) calibrates them.
name: worldsign-A

encoder:                      # §4.4.1: V-JEPA 2.1 ViT-L distilled, frozen + LoRA (PC3, 29/9)
  hub_repo: checkpoints/hub/facebookresearch_vjepa2_main
  entrypoint: vjepa2_1_vit_large_384
  checkpoint: checkpoints/vjepa21/vjepa2_1_vitl_384.pt
  checkpoint_sha256: b25d62511e1ee624d0b42390c524996900a79eca81806b378477db2c0644c6d8   # P5
  levels: [5, 11, 17, 23]     # blocks 6/12/18/24, the code's hierarchical_layers
  lora: {rank: 16, alpha: 16.0, targets: [qkv, proj, fc1, fc2]}   # alpha [Aperto]
  train_norms: true           # the 0.10 M «LayerNorm e bias» of §4.8
  activation_checkpointing: true

masking:                      # §4.5.2: V-JEPA's masks unchanged, both kinds at every step
  specs:
    - {blocks: 8, spatial_scale: 0.15, temporal_scale: 1.0, aspect_ratio: [0.75, 1.5]}
    - {blocks: 2, spatial_scale: 0.70, temporal_scale: 1.0, aspect_ratio: [0.75, 1.5]}

fusion:                       # §4.4.5: mlp (V-JEPA 2.1) | linear | residual  [Aperto]
  kind: mlp
  hidden: 1024

physical:
  enabled: true
  lora: {rank: 16, alpha: 16.0, targets: [qkv, proj, fc1, fc2]}
  target_dim: 192             # C, width of the pose target s_t (pose_encoder.output_dim)
  mask_index: 0               # the only trained mask token (PC6)
  dropout: 0.1                # in the predictor's blocks, as LeWorldModel's predictor
  context_lambda: 0.5         # λ of the visible tokens (V-JEPA 2.1)
  lambda_progressive: false   # V-JEPA 2.1 cooldown: λ from the first step
  lambda_warmup: [0.0595, 0.119]   # used only if progressive (its pre-training: 15k-30k of 252k)
  weight_distance: false      # V-JEPA 2.1 cooldown: every visible token weighs 1
  box_threshold: 0.3          # [Aperto: 0.3 (Uni-Sign) or 1.0 (§3.6)]

semantic:                     # §4.4.6: VL-JEPA's scheme, 4 blocks at 384, from scratch
  width: 384
  depth: 4
  heads: 12
  queries: 8
  hypotheses: 1               # 4 only in ESP-4
  relaxation: 0.05            # ε of ESP-4 [Aperto: PC7]
  output_dim: 512
  mlp_ratio: 4.0
  dropout: 0.1                # [Aperto: PC7]
  drop_path: 0.1              # [Aperto: PC7]
  layer_scale: 1.0e-4         # [Aperto: PC7]
  trains_encoder: false       # level by level: reads sg(Enc(x)); true = the «global» ablation

losses:                       # §4.5.7
  arm: A
  sigreg_weight: 0.05         # λ of the semantic level (to be reviewed with it)
  pose_sigreg_weight: 0.04    # λ of the pose: LeJEPA's 0.02 for 4 views at N = 256, x2 for N <= 128
  sigreg_directions: 1024     # LeJEPA's recommendation
  sigreg_knots: 17
  uniformity_t: 2.0
  infonce_temperature: 0.07

sampling:                     # §3.6: 32 frames by local motion + 32 uniform in time
  strategy: motion
  frames: 64
  uniform_fraction: 0.5
  stride: 3
  block: 8
  top_blocks: 8

augmentation:                 # §3.8: same geometry on video and keypoints; no flip
  box_jitter: 0.10
  brightness: 0.2             # [Aperto]
  contrast: 0.2               # [Aperto]
  saturation: 0.2             # [Aperto]

pose_encoder:                 # docs/worldsign-posa.md: worldSign's encoder, from scratch
  part_width: 128             # each articulator's spatial transformer
  part_depth: 2
  depth: 2                    # temporal transformer at 4 x 128 = 512
  heads: 8
  mlp_ratio: 4.0
  dropout: 0.0                # the target sg(s) must not depend on a dropout draw
  output_dim: 192             # C: LayerNorm(512) + Linear(512 -> 192), LeWM's best size
  learning_rate: 3.0e-4       # worldSign's value
  warmup_epochs: 2.0          # warm-up over stage P, then a cosine to 0: the target slows from F0
  views:                      # 3 draws of nuisances + the clean sequence: 4 views (posa §4.1)
    count: 3
    rotation_degrees: 10.0    # always, per clip
    aspect: 0.15              # horizontal scale in [0.85, 1.15] (SPOTER), with probability 0.5
    shear: 0.1                # x <- x + h·y, |h| <= 0.1, with probability 0.5
    affine_probability: 0.5
    noise_body: 0.003         # Gaussian noise at the jitter measured on OpenASL
    noise_hands: 0.01
    noise_face: 0.002
    mask_probability: 0.5     # 9 finger or face joints hidden over 8 steps (PSTL)
    mask_steps: 8
    mask_joints: 9

text:                         # §4.4.4: EmbeddingGemma pre-computed, centred per language
  input_dim: 768              # whole vector, no truncation
  hidden: 512                 # head 768 -> 512 -> 512, GELU, standard initialisation
  output_dim: 512
  dropout: 0.1                # [Aperto: PC7]

training:                     # §4.10 and docs/worldsign-gerarchia.md §6
  batch_size: 128
  epochs: 15
  patience: 3                 # epochs without improvement, counted in stage F only
  learning_rate: 2.0e-4       # [Aperto: PC7, {1e-4, 2e-4, 5e-4}]
  betas: [0.9, 0.999]         # AdamW as V-JEPA 2.1
  weight_decay: 0.04          # V-JEPA 2.1, constant
  gradient_clip: null         # V-JEPA 2.1 does not clip
  activation_warmup_epochs: 2.0   # every family but the pose, from its entry
  cooldown_fraction: 0.05
  stages: {pose_epochs: 2, heads_epochs: 1}     # P = epochs 1-2, F0 = epoch 3, F = the rest
  precision: bf16
  seed: 0
  validation_every: 4000      # steps: ~500,000 clips at batch 128
  log_every: 20
  find_unused_parameters: false

data:                         # §3.4, §4.10; the index and embeddings come from stage 0
  index: null                 # set when the corpus is downloaded and materialised
  embeddings: null
  validation_fraction: 0.1    # channels held out per sign language [Aperto]
  held_out_languages: []      # the held-out language split [Aperto]
  seen_video_fraction: 0.02   # new videos of seen channels, for the channel gap [Aperto]
  manifest: null              # the corpus manifest, for P2
  benchmarks: []              # benchmark manifests (OpenASL, ...) for P2 and the index
  validation_clips: 2000
  statistics_clips: 20000     # clips that fix the keypoint scale of L_anchor
  workers: 8
  prefetch: 2
